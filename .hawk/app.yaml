version: 1
id: hawk-app-template
displayName: Hawk App Template
image: ghcr.io/OWNER/REPOSITORY@sha256:REPLACE_WITH_IMMUTABLE_DIGEST
containerPort: 3000
healthPath: /health
hostname: app-template
replicas: 1
auth:
  # No authentication is the sample default, not a requirement for derived apps.
  # Choose hawk-suite-proxy only when the application needs the Suite login gate.
  mode: none
persistence:
  - name: data
    mountPath: /data
environment:
  DATA_DIR: /data
  PORT: "3000"
  HOST: 0.0.0.0
  LOG_LEVEL: info
migrations:
  mode: before-server-start
